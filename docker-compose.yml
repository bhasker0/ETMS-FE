services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_NAME=Surat Embroidery Micro-ERP
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_DEFAULT_LOCALE=gu
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:${FRONTEND_PORT:-3002}/api
      - DEFAULT_GST_RATE=5.0
      - DEFAULT_SAC_CODE=9988
      - TALLY_COMPANY_NAME=SHREE GANESH EMBROIDERY WORKS
      - CLIENT_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - etms-network

  nginx:
    image: nginx:alpine
    container_name: etms_proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - etms-network

networks:
  etms-network:
    name: etms_etms-network
    external: true
