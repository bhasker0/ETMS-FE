services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: etms_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_APP_NAME=Surat Embroidery Micro-ERP
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_DEFAULT_LOCALE=gu
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:4000}
      - DEFAULT_GST_RATE=5.0
      - DEFAULT_SAC_CODE=9988
      - TALLY_COMPANY_NAME=SHREE GANESH EMBROIDERY WORKS
      - CLIENT_LOG_LEVEL=info
    command: npm run dev -- -H 0.0.0.0
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.mjs:/app/next.config.mjs
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - etms-network

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: etms_proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - etms-network

networks:
  etms-network:
    name: etms_etms-network
    external: true
